version: "3.8"

# Olidesk server stack — relay + signal + address-book API
# Place your actual relay/signal config in hbbr/hbbs sections as needed.

services:

  # -------------------------------------------------------------------------
  # RustDesk / Olidesk relay server
  # -------------------------------------------------------------------------
  hbbr:
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    restart: unless-stopped
    ports:
      - "21117:21117"
      - "21119:21119"
    volumes:
      - ./data/relay:/root
    networks:
      - olidesk

  # -------------------------------------------------------------------------
  # RustDesk / Olidesk signal / rendezvous server
  # -------------------------------------------------------------------------
  hbbs:
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    restart: unless-stopped
    depends_on:
      - hbbr
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    volumes:
      - ./data/relay:/root
    networks:
      - olidesk

  # -------------------------------------------------------------------------
  # Olidesk address-book API
  # -------------------------------------------------------------------------
  olidesk-api:
    build:
      context: ./olidesk-api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./data/api:/data
      # Override config at runtime — edit this file on the host, not inside the image
      - ./olidesk-api/config.json:/app/config.json:ro
    environment:
      - CONFIG_PATH=/app/config.json
    networks:
      - olidesk
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8443/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  olidesk:
    driver: bridge

volumes:
  relay-data:
  api-data:
