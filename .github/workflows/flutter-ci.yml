name: Full Flutter CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"
  push:
    branches:
      - master
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "README.md"
      - "res/msi/**"
      - "res/PKGBUILD"
      - "res/*.svg"
      - "res/*.png"
      - "res/*.ico"
      - "res/*.desktop"
      - "res/*.service"
      - "appimage/**"
      - "flatpak/**"

permissions:
  contents: write

jobs:
  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
