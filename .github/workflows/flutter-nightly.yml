name: Flutter Nightly Build

on:
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # See flutter-tag.yml for why this reads Cargo.toml instead of a literal.
  resolve-version:
    name: resolve version from Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Read version from Cargo.toml
        id: v
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "Resolved VERSION=$VERSION from Cargo.toml"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  run-flutter-nightly-build:
    needs: [resolve-version]
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
      upload-version: ${{ needs.resolve-version.outputs.version }}
